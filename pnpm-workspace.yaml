# pnpm settings for the single-package repo (PR-2.4).
#
# Not a workspace definition — there is no `packages:` list and no monorepo.
# pnpm 10+ reads its own settings from this file, and pnpm writes an `allowBuilds`
# entry here for every dependency that ships a lifecycle build script, refusing to
# run them until each is answered. Every entry below ships a prebuilt binary in a
# per-platform optional package, so none of them needs its install script to be
# usable; all stay `false` and `pnpm install --frozen-lockfile` is deterministic
# in CI (09 §3) instead of pausing on a prompt.
#
#   @parcel/watcher — Next's fallback file watcher for `next dev`
#   @swc/core       — pulled in beside `@swc/helpers`; Next bundles its own SWC
#   esbuild         — tsx's transpiler (PR-3.4); its optional per-platform
#                     package ships the prebuilt binary, so the install script
#                     has nothing left to do and `pnpm exec tsx` works without it
#
# Flip one to `true` only with a reason: a build script is arbitrary code from a
# transitive dependency running on every developer's machine and in CI.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
