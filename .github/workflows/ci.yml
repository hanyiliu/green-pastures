# The quality pipeline — docs/technical/08-testing-quality.md §10 (job table),
# §2 (static checks), D-08.7 (e2e runs against a local production build) and
# D-08.12 (the required-check names).
#
# No job declares a `name:`, so the check GitHub reports is the job id verbatim
# and the human can paste it into the ruleset unchanged (D-08.19, OQ-11.3) —
# the same convention `bead-trailer.yml` follows. The six checks D-08.12 makes
# required on `main` are `static`, `content`, `unit`, `build`, `e2e-ok` and
# `bead-trailer`. Five are below; `bead-trailer` is its own workflow (11 §6).
# `content` arrived with PR-3.4, the PR that created the `pnpm validate:content`
# script it runs. A required check whose job does not exist yet blocks every PR,
# which is why the name was withheld until now: **the human adds `content` to
# the ruleset's required list when this PR merges.**
#
# Later PRs ADD jobs to this file and never edit an existing one (10 §10):
# PR-3.4 the `content` job, PR-8.5 the `budget` job. Both have landed. PR-8.5's
# other half — `lighthouse-preview` and `lighthouse-prod` — is **not** here and
# could not be: both fire on `deployment_status`, an `on:` trigger this file
# does not have, and adding one would start `static`, `content`, `unit`, `build`
# and `e2e` on every deployment event unless each grew an `if:` guard — five
# edits to existing jobs, taken to avoid one new file. They live in
# `lighthouse.yml` instead, for the reason D-10.15 gives for `audit.yml` and
# `nightly.yml`: a workflow with its own trigger is its own file, and a
# single-owner file needs no serialisation rule at all. Three named
# exceptions, each confined to one step and serialised by phase: the
# `--warn-locale` flags on `content` (10's own carve-out); `static`'s
# `check:todo` step, whose inlined body became a call to the script that now
# holds it; and `content`'s upload step, whose `if-no-files-found` went from
# `warn` to `error` when `gp-dln.224` made the report CI-only and that upload
# one of the three copies rather than a convenience — 08 §10 records each
# choice and the alternative it beat. `gp-dln.224`'s own gate is **appended**,
# not an edit: `check:coverage-report` is the job's last step.
#
# Every step here runs a script that exists in `package.json` today, `budget`'s
# `check:budget` included. The steps
# 08 §10's `static` row also names — `check:tokens` (PR-4.x), `check:env`, the
# `@flaky-known` tag lint (D-08.13) and the dependency allowlist — are
# deliberately absent: their scripts do not exist yet, and a job calling a
# missing script fails on every PR. `check:todo` was in that list until its
# script was written; it is a `package.json` entry now, like every step here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# INV-08.7: a PR run gets no secrets beyond `GITHUB_TOKEN`, and this workflow
# reads nothing but the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 08 §10 `static` · 10 min · required.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # This order is load-bearing, not stylistic: `setup-node`'s `cache: pnpm`
      # resolves the store by shelling out to `pnpm store path`, so it fails
      # outright unless pnpm is already on PATH (08 §10). `pnpm/action-setup`
      # takes its version from `packageManager`; `setup-node` takes Node from
      # `.nvmrc` (= 24). Third-party actions are pinned to a commit SHA and
      # `actions/*` to a major (08 §10 conventions).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck
      - name: eslint
        run: pnpm run lint
      - name: stylelint
        run: pnpm run lint:css
      - name: prettier
        run: pnpm run format:check

      # TRAP-11.9 / 08 §2. A comment is not tracked work: a work marker left in
      # source text fails the PR, and the fix is a bead.
      #
      # The two `git grep` commands, the `-w` history that is the reason they are
      # not written with `\b`, the `content/**` carve-out and the rule that prose
      # *about* a marker counts as source text all live in the script, which is
      # the only copy of them. This step is now the same command a developer
      # types, because a gate that runs only here is how `main` went red on a
      # violation the author's own `pnpm verify` reported clean (INV-08.6).
      #
      # Replacing this body was an edit to an existing job, which 10's `ci.yml`
      # serialisation rule — additions are new jobs, never edits — otherwise
      # forbids. 08 §10 names the exception and why the alternative was worse.
      - name: check:todo
        run: pnpm run check:todo

  # 08 §10 `content` · 5 min · REQUIRED (D-08.12). The content contract's gate:
  # `pnpm validate:content` checks three-way key/tag/array parity against `en`,
  # ICU arguments as a subset (INV-02.2), key shape, empty strings, `'{`, HTML,
  # the INV-02.4 data-pattern scan, the Zod schemas and their id cross-refs,
  # assets and alt text, and it resolves and prints the provisional registry
  # (INV-02.10). `--release` is NOT run here — it is `lighthouse-prod`'s
  # preflight at the launch gate (08 §3, §12.3).
  #
  # `--warn-locale zh-Hans` is the phased-translation flag of 08 §3 / HD-12: it
  # demotes that locale's PARITY findings to warnings while its tree is being
  # filled in, and affects nothing else — never the Zod checks, never INV-02.4,
  # never the registry. It is the one line in this file later PRs edit rather
  # than append to (10 §7): PR-3.9 adds `--warn-locale zh-Hant`, PR-8.1 removes
  # the `zh-Hans` flag and PR-8.8 the `zh-Hant` one. No other PR touches it.
  #
  # The report this job writes is **not in the repository** (D-08.20,
  # `gp-dln.224`): it is a derived aggregate over all of `content/**`, a
  # three-way merge cannot add, and two content branches that each add one `en`
  # key merge to a total that is wrong with no conflict to warn anyone. So the
  # three publications below — job summary, sticky comment, artifact — are the
  # whole of it, each generated from the commit under test and none able to go
  # stale. That makes their fail-open real: three steps that quietly do nothing
  # when the file is absent used to add up to a green job with no report at all.
  # The last step closes it, and it is the same script `pnpm verify` runs.
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The sticky coverage comment (08 §3, INV-02.6) is the only write in this
      # workflow; every other job runs on the read-only default above.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `continue-on-error` so the report still reaches the summary, the sticky
      # comment and the artifact when the gate is red — an editor's to-do list is
      # most useful on exactly the run that failed. The last step re-raises it.
      - name: validate:content
        id: validate
        continue-on-error: true
        run: pnpm run validate:content --report --warn-locale zh-Hans --warn-locale zh-Hant

      - name: job summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f reports/content-coverage.md ]; then
            cat reports/content-coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::validate:content produced no reports/content-coverage.md"
          fi

      # One sticky comment per PR, rewritten in place on every push, so the
      # editor sees the current missing-key list and the shrinking provisional
      # block instead of a thread of stale ones (08 §3; 09 explains it).
      - name: coverage comment
        if: always() && github.event_name == 'pull_request' && hashFiles('reports/content-coverage.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: content-coverage
          path: reports/content-coverage.md

      # `error`, not `warn`: this upload is one of the report's three copies now
      # that none is committed, and an artifact step that shrugs at an empty
      # upload is the same fail-open the last step exists to close.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: content-coverage
          path: reports/content-coverage.md
          if-no-files-found: error
          retention-days: 7

      - name: require validate:content to have passed
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::pnpm validate:content found at least one error — see the job summary and the PR comment (08 §3)."
          exit 1

      # D-08.20. Asserts the run produced a report and that the report is CI
      # output — ignored and untracked. `if: always()` because it has to reach a
      # verdict on a red gate too: `validate:content` writes the report either
      # way and the step above may already have exited 1. Last, so the editor's
      # three publications happen first and this only judges them. One script,
      # two callers (INV-08.6) — `pnpm verify` runs the same `pnpm run
      # check:coverage-report`, so a seat that re-commits the report finds out
      # on their own machine rather than here.
      - name: check:coverage-report
        if: always()
        run: pnpm run check:coverage-report

  # 08 §10 `unit` · 10 min · required.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `vitest run --coverage`. D-08.16 sets no global floor; the per-glob
      # thresholds in `vitest.config.ts` are what can fail this step.
      - name: vitest
        run: pnpm run test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # 08 §10 `build` · 15 min · required. This job is the only place `next build`
  # is verified: the local sandbox cannot run it (08 §11, status note).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 08 §10: keyed on the lockfile plus a hash of the inputs a rebuild has to
      # invalidate, restore-keys on the lockfile alone. `content/**` and
      # `public/**` do not exist yet — `hashFiles` returns an empty string for a
      # pattern that matches nothing, so the key is stable until they arrive.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: >-
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
            hashFiles('src/**', 'content/**', 'public/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: next build
        run: pnpm run build

      # D-08.7: `e2e` serves this output with `next start` rather than building
      # again or pointing at a Vercel preview. `include-hidden-files` is
      # required — every path in the artifact lives under the dot-directory
      # `.next`, and upload-artifact skips hidden files by default.
      # `.next/cache` is excluded: it is the build cache above, not output.
      # D-08.11's `scripts/ci/bundle-secrets.sh` grep over `.next/static/**`
      # becomes a step here in the PR that writes that script.
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          include-hidden-files: true
          path: |
            .next
            !.next/cache
          # An empty artifact would surface as an unexplained `next start`
          # failure two jobs later; fail here instead.
          if-no-files-found: error
          retention-days: 1

  # 08 §10 `e2e` · 25 min · required through `e2e-ok`, never by name (a matrix
  # job reports one check per shard, `e2e (1)` and `e2e (2)`).
  #
  # The container is not a convenience: browsers and their OS dependencies ship
  # in the image, so there is no `install-deps` step and no browser cache, and
  # its fonts are the ones the `@visual` baselines were taken in (D-08.10). On a
  # bare runner the font set differs and every CJK screenshot would diff
  # forever. The tag tracks `@playwright/test` in `package.json` — Renovate
  # bumps both in one PR, and a mismatch is a startup error, not a silent skew.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      # `playwright.config.ts` starts the server itself (`pnpm start`) against
      # the artifact above and supplies the test-key environment of INV-08.7.
      # Not `pnpm test:e2e`: that script bakes in `--grep-invert @visual` for
      # macOS hosts, and this container is the one place `@visual` may run.
      # D-08.13: `retries: 0` and no re-run-to-green — a red shard gets a fix.
      - name: playwright
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            blob-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # 08 §10 `e2e-ok` · 2 min · REQUIRED. One stable check name standing in for a
  # matrix whose own names change with the shard count.
  e2e-ok:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # `needs.e2e.result` is `success` only when every shard succeeded; a
      # skipped `e2e` (because `build` failed) or a cancelled run is not
      # success and must not report green.
      - name: require every e2e shard to have succeeded
        run: |
          set -euo pipefail
          result='${{ needs.e2e.result }}'
          echo "e2e result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::e2e did not succeed (result: $result)"
            exit 1
          fi

  # 08 §10 `budget` · 10 min · advisory (not one of D-08.12's six required
  # names; a human adds it to the ruleset when the site is inside 08 §7's
  # transfer budget and the job can be relied on to be green).
  #
  # This is PR-8.5's job, and it is the **addition** 10 §10's rule asks for: a
  # new job, no edit to an existing one. It is deliberately not a step inside
  # `build` even though it reads `build`'s output — a step there would be the
  # edit the rule forbids, and the artifact download costs seconds.
  #
  # What it does *not* do is assert transfer sizes. 08 §7 settles that: "bundle
  # weight is measured where it is real — the preview's transfer sizes — not
  # re-implemented locally". Those assertions are `lighthouserc.cjs`'s, run by
  # `lighthouse.yml` against a deployment. This job takes the half a build
  # directory can decide on its own — font bytes, image bytes and names,
  # third-party origins, and first-load growth against a recorded ceiling — and
  # prints Next's per-route first-load table into the job summary, which is the
  # "route summary into the job summary" 08 §7 asks for.
  #
  # One script, two callers (INV-08.6): `pnpm verify` runs the same
  # `pnpm run check:budget` after its own `pnpm build`, so a seat finds a budget
  # failure on their own machine rather than here.
  budget:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same artifact `e2e` serves (D-08.7), read rather than served: the
      # per-route first-load figures are Next's own, in
      # `.next/diagnostics/route-bundle-stats.json`, and the font, image and
      # third-party checks read the prerendered home pages under
      # `.next/server/app/`.
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: check:budget
        run: pnpm run check:budget
